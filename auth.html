<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЛИЧНЫЙ КАБИНЕТ</title>
  <link rel="icon" type="image/png" href="assets/image/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;800&family=Exo+2:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      color-scheme: dark;
      --bg: #02070a;
      --panel: rgba(8, 13, 16, .96);
      --panel-2: #0d1519;
      --border: rgba(138, 160, 168, .3);
      --line-soft: rgba(138, 160, 168, .24);
      --cyan: #00f0ff;
      --text: #d9e1e4;
      --muted: #829199;
      --danger: #a96468;
      --ok: #92aaa0;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      font-family: "Roboto Mono", monospace;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-image: 
        linear-gradient(rgba(138, 160, 168, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(138, 160, 168, .02) 1px, transparent 1px);
      background-size: 26px 26px;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 0 30px rgba(0, 0, 0, .9), inset 0 0 16px rgba(138, 160, 168, .05);
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .auth-header img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      margin-bottom: 10px;
    }
    .auth-header h1 {
      margin: 0;
      font: 800 20px "Exo 2", sans-serif;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
    }
    .auth-header span {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
    }
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 22px;
      border-bottom: 1px solid rgba(138, 160, 168, 0.2);
      padding-bottom: 8px;
    }
    .auth-tab-btn {
      background: transparent;
      border: none;
      padding: 8px;
      font: 800 12px "Exo 2", sans-serif;
      color: var(--muted);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }
    .auth-tab-btn.is-active {
      color: var(--cyan);
      border-bottom: 2px solid var(--cyan);
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .auth-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .auth-field label {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .auth-field input {
      background: var(--panel-2);
      border: 1px solid var(--border);
      padding: 10px 12px;
      color: #fff;
      font-family: "Roboto Mono", monospace;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .auth-field input:focus {
      border-color: var(--cyan);
      box-shadow: inset 2px 0 0 var(--cyan);
    }
    .auth-submit-btn {
      margin-top: 8px;
      background: #111a20;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      padding: 12px;
      font: 800 13px "Exo 2", sans-serif;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s ease-out;
    }
    .auth-submit-btn:hover {
      background: var(--cyan);
      color: #000;
      box-shadow: 0 0 14px rgba(0, 240, 255, .3);
    }
    .auth-msg {
      font-size: 11.5px;
      font-weight: 700;
      min-height: 18px;
      text-align: center;
      margin-top: 6px;
    }
    .auth-msg[data-state="pending"] { color: var(--cyan); }
    .auth-msg[data-state="success"] { color: var(--ok); }
    .auth-msg[data-state="error"] { color: var(--danger); }
    .auth-form[hidden] { display: none; }
    .auth-back {
      margin-top: 18px;
      text-align: center;
      font-size: 11px;
    }
    .auth-back a {
      color: var(--muted);
      text-decoration: underline;
    }
    .auth-back a:hover {
      color: var(--text);
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <img src="assets/image/favicon.png" alt="Deinopidae Core">
      <h1>ЛИЧНЫЙ КАБИНЕТ</h1>
      <span>DEINOPIDAE INDUSTRIES</span>
    </div>

    <div class="auth-tabs" role="tablist" aria-label="Выбор действия">
      <button type="button" class="auth-tab-btn is-active" id="tab-login-btn" role="tab" aria-selected="true" aria-controls="form-login">ВХОД</button>
      <button type="button" class="auth-tab-btn" id="tab-reg-btn" role="tab" aria-selected="false" aria-controls="form-register">РЕГИСТРАЦИЯ</button>
    </div>

    <form class="auth-form" id="form-login" aria-labelledby="tab-login-btn">
      <div class="auth-field">
        <label for="login-identifier">ИМЯ ПОЛЬЗОВАТЕЛЯ ИЛИ ROBLOX НИКНЕЙМ:</label>
        <input type="text" id="login-identifier" required autocomplete="username" placeholder="Введите логин или ник">
      </div>
      <div class="auth-field">
        <label for="login-pass">ПАРОЛЬ:</label>
        <input type="password" id="login-pass" required autocomplete="current-password" placeholder="Введите пароль">
      </div>
      <button type="submit" class="auth-submit-btn">ВОЙТИ В СИСТЕМУ</button>
    </form>

    <form class="auth-form" id="form-register" aria-labelledby="tab-reg-btn" hidden>
      <div class="auth-field">
        <label for="reg-username">ИМЯ ПОЛЬЗОВАТЕЛЯ:</label>
        <input type="text" id="reg-username" required autocomplete="username" placeholder="Отображаемое имя">
      </div>
      <div class="auth-field">
        <label for="reg-roblox">НИКНЕЙМ ROBLOX (НЕ DISPLAY NAME):</label>
        <input type="text" id="reg-roblox" required autocomplete="off" placeholder="Пример: EGORIK0130">
      </div>
      <div class="auth-field">
        <label for="reg-pass">ПАРОЛЬ:</label>
        <input type="password" id="reg-pass" required autocomplete="new-password" placeholder="Введите пароль">
      </div>
      <div class="auth-field">
        <label for="reg-pass2">ПОВТОР ПАРОЛЯ:</label>
        <input type="password" id="reg-pass2" required autocomplete="new-password" placeholder="Повторите пароль">
      </div>
      <button type="submit" class="auth-submit-btn">ЗАРЕГИСТРИРОВАТЬСЯ</button>
    </form>

    <div class="auth-msg" id="auth-msg" role="status" aria-live="polite"></div>

    <div class="auth-back">
      <a href="index.html">Вернуться к КПК Deinopidae</a>
    </div>
  </div>

  <script defer src="js/api.js"></script>
  <script defer src="js/auth.js"></script>
</body>
</html>
